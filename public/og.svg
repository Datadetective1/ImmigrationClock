<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="0.6" stop-color="#0f1424"/>
      <stop offset="1" stop-color="#1c2440"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g transform="translate(64,64)">
    <rect width="44" height="44" rx="12" fill="url(#logo)"/>
    <text x="60" y="30" font-family="Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Immigration<tspan fill="#38bdf8">Clock</tspan></text>
  </g>
  <text x="64" y="330" font-family="Segoe UI, sans-serif" font-size="72" font-weight="800" fill="#ffffff">The Immigration Clock</text>
  <text x="64" y="392" font-family="Segoe UI, sans-serif" font-size="30" fill="#94a3b8">Live public data on immigration, visas, enforcement, and jobs.</text>
  <text x="64" y="566" font-family="Segoe UI, sans-serif" font-size="24" fill="#64748b">Facts first. Trends live. Sources included.</text>
</svg>
