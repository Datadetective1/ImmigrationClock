# Netlify configuration for ImmigrationClock.
# The app is a static export (next.config.js: output "export"), so Netlify just
# serves the generated `out/` directory — no Next.js runtime plugin needed.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
