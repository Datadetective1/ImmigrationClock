# Commercial smoke check — what production actually serves, read-only.
#
# Run by hand (Actions → Commercial smoke check → Run workflow) after a deploy
# or an environment-variable change. It reads public pages only: it never signs
# in, starts a checkout, or sends anything. Each line of the job summary is one
# fact about the live site; nothing here needs a secret.
name: Commercial smoke check

on:
  workflow_dispatch:
    inputs:
      site:
        description: "Origin to check"
        default: "https://immigrationclock.com"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE: ${{ github.event.inputs.site || 'https://immigrationclock.com' }}
      # Operator-only health (/api/admin/health). Unset: that line is skipped.
      MONITOR_TOKEN: ${{ secrets.MONITOR_TOKEN }}
    steps:
      - name: Check live pages
        run: |
          set -u
          get() { curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$SITE$1"; }
          say() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          yes_no() { if [ "$1" -gt 0 ]; then echo yes; else echo NO; fi; }

          say "## Commercial smoke check: $SITE"

          HOME_HTML=$(get /) || { say "- homepage: UNREACHABLE"; exit 1; }
          # Plausible is injected by client JS, so it never appears in the HTML.
          # Read the page's own script chunks instead: with the domain configured
          # the bare string "immigrationclock.com" is compiled in next to the
          # Plausible loader; without it the loader is dead code.
          CHUNKS=""
          for src in $(grep -oE '/_next/static/[^"]+\.js' <<<"$HOME_HTML" | sort -u); do
            CHUNKS+=$(curl -fsSL --max-time 30 "$SITE$src" || true)
          done
          say "- Plausible loader in shipped JS: $(yes_no "$(grep -c 'plausible.io/js/script' <<<"$CHUNKS")")"
          say "- Plausible domain compiled in (\"immigrationclock.com\"): $(yes_no "$(grep -c '"immigrationclock.com"' <<<"$CHUNKS")")"
          # Headline figures must be real numbers in the HTML (they once rendered
          # as 0 until scrolled into view), and homepage changes must open their
          # own record, not only the government site.
          say "- homepage figures in HTML (expect real numbers, not 0): $(grep -oE 'tabular-nums">[^<]+' <<<"$HOME_HTML" | head -4 | sed 's/.*">//' | tr '\n' ' ')"
          say "- homepage change titles linking to their record: $(grep -oE 'href="/what-changed/[a-z0-9-]+"' <<<"$HOME_HTML" | sort -u | wc -l | tr -d ' ')"

          if [ -n "${MONITOR_TOKEN:-}" ]; then
            HEALTH=$(curl -fsSL --max-time 30 -H "Authorization: Bearer $MONITOR_TOKEN" "$SITE/api/admin/health" || echo '{}')
            say "- data last ingested: $(jq -r '.pipeline.lastSuccessfulIngestion // "unknown"' <<<"$HEALTH")"
            say "- billing readiness (operator): $(jq -c '.billing // "unreadable"' <<<"$HEALTH")"
          else
            say "- operator health: skipped (MONITOR_TOKEN not set)"
          fi

          CHECKOUT=$(curl -sS --max-time 30 "$SITE/api/billing/checkout" || echo '{}')
          say "- billing: $(jq -c '{checkoutReady,webhookReady,testMode}' <<<"$CHECKOUT" 2>/dev/null || echo unreadable)"

          ALERTS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$SITE/api/billing/alerts/run")
          case "$ALERTS" in
            401) say "- alert job: configured (cron secret set; refused this unauthenticated call) — HTTP 401" ;;
            503) say "- alert job: NOT configured (cron secret unset) — HTTP 503" ;;
            *)   say "- alert job: unexpected HTTP $ALERTS" ;;
          esac

          PRICING=$(get /pricing || echo '')
          say "- pricing lists email alerts: $(yes_no "$(grep -c 'Email alerts on your watchlist' <<<"$PRICING")")"

          DISCLOSURE=$(get /disclosure || echo '')
          say "- disclosure names Pro: $(yes_no "$(grep -c 'ImmigrationClock Pro' <<<"$DISCLOSURE")")"
          say "- disclosure still claims AdSense (should be NO): $(yes_no "$(grep -ci 'adsense' <<<"$DISCLOSURE")")"

          RESOURCES=$(get /resources || echo '')
          LINK=$(grep -oE 'href="[^"]*immitranslate[^"]*"' <<<"$RESOURCES" | head -1 | sed 's/&amp;/\&/g')
          say "- ImmiTranslate link on /resources: ${LINK:-NONE}"
          say "- competitor link still present (should be NO): $(yes_no "$(grep -c 'rushtranslate' <<<"$RESOURCES")")"

          TERMS=$(get /terms || echo '')
          say "- contact email configured on /terms: $(yes_no "$(grep -c 'mailto:' <<<"$TERMS")")"

          # PRO BRIEFING, seen from outside. Signed out, the page shows its
          # sign-in gate and every API answers 401; a 404 means the
          # FEATURE_PRO_BRIEFING flag is off in this deployment.
          code() { curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$@"; }
          BRIEF=$(code "$SITE/briefing")
          BRIEF_HTML=$(curl -sS --max-time 30 "$SITE/briefing" || echo '')
          case "$BRIEF" in
            200) say "- briefing: flag ON — signed-out gate shown: $(yes_no "$(grep -c 'Sign in to see your Briefing' <<<"$BRIEF_HTML")")" ;;
            404) say "- briefing: flag OFF (HTTP 404)" ;;
            *)   say "- briefing: unexpected HTTP $BRIEF" ;;
          esac
          say "- admin workspace signed out (expect 404): refresh $(code "$SITE/admin/refresh-status") · newsletter $(code "$SITE/admin/pulse-email") · health API $(code "$SITE/api/admin/health")"
          say "- retired public health file (expect 404): $(code "$SITE/api/health.json")"
          say "- briefing APIs signed out (expect 401): saved $(code "$SITE/api/pro/saved") · prefs $(code "$SITE/api/pro/prefs") · brief $(code "$SITE/api/pro/brief") · erase $(code -X DELETE "$SITE/api/pro/data")"
          say "- briefing API with a forged session cookie (expect 401): $(code -H 'Cookie: ic_ent=forged.value' "$SITE/api/pro/saved")"
          say "- calendar feed with a bad token (expect 404): $(code "$SITE/api/pro/calendar/AAAAAAAAAAAAAAAAAAAAAAAA.1.BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB.ics")"

          # ALERT LINKS. Alerts link to the change page's address (title slug
          # plus hash). Before the fix they used the bare record id, a 404.
          LATEST=$(curl -sS --max-time 30 "$SITE/api/v1/changes?limit=1" || echo '{}')
          PAGE=$(jq -r '.data[0].url // empty' <<<"$LATEST" | sed -E 's#^https?://[^/]+##')
          RECORD=$(jq -r '.data[0].recordId // empty' <<<"$LATEST")
          if [ -n "$PAGE" ]; then
            # Is the Briefing release deployed at all? Its Save button ships in
            # every change page's JS whether or not the flag is on, so this
            # tells "flag off" apart from "code not deployed yet".
            CHANGE_HTML=$(curl -sS --max-time 30 "$SITE$PAGE" || echo '')
            CHANGE_JS=""
            for src in $(grep -oE '/_next/static/[^"]+\.js' <<<"$CHANGE_HTML" | sort -u); do
              CHANGE_JS+=$(curl -fsSL --max-time 30 "$SITE$src" || true)
            done
            say "- Briefing release deployed (Save button in change-page JS): $(yes_no "$(grep -c 'Save to your Briefing' <<<"$CHANGE_JS")")"
            say "- alert link $PAGE (expect 200): $(code "$SITE$PAGE")"
            say "- old-style alert link /what-changed/$RECORD (was emailed before the fix; 404): $(code "$SITE/what-changed/$RECORD")"
          else
            say "- alert link: could not read /api/v1/changes"
          fi

          PRICING_HTML=${PRICING:-}
          say "- pricing names Briefing: $(yes_no "$(grep -c 'Briefing' <<<"$PRICING_HTML")")"

          # The redesign (FEATURE_UX_V2) marks <html data-theme="auto">; off, the
          # attribute is absent. Read after an activation to confirm it is live.
          say "- redesign live (FEATURE_UX_V2): $(yes_no "$(grep -c 'data-theme="auto"' <<<"$HOME_HTML")")"
          # The comment-deadline fix: this record must not present a public
          # comment deadline as something its subjects must do.
          REFUGEE=$(get /what-changed/removing-30-day-refugee-termination-notice-56was9 || true)
          say "- refugee record free of the comment-deadline quote (expect yes): $(if [ -n "$REFUGEE" ] && ! grep -q 'Written comments and related materials' <<<"$REFUGEE"; then echo yes; else echo NO; fi)"
          # With the redesign on: the compact list and the record page's own
          # blocks are served, and no internal field name reaches a reader.
          WC=$(get /what-changed || true)
          say "- What Changed redesign (coverage line, show-more): $(yes_no "$(grep -c 'changes recorded' <<<"$WC")") · $(yes_no "$(grep -c 'more from the last 30 days' <<<"$WC")")"
          say "- record redesign (source button, About this record): $(yes_no "$(grep -c 'Read on Federal Register' <<<"$REFUGEE")") · $(yes_no "$(grep -c 'About this record' <<<"$REFUGEE")")"
          say "- record shows no field names (expect NO): $(if grep -qE '\((effectiveAt|impact\.[a-zA-Z]+)' <<<"$REFUGEE"; then echo yes; else echo NO; fi)"
          say "- record keeps structured data: $(yes_no "$(grep -c 'application/ld+json' <<<"$REFUGEE")")"

