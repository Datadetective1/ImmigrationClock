# ImmigrationClock social publishing — one high-quality post a day.
#
# THE GOVERNING PRINCIPLE
# -----------------------
# ImmigrationClock never posts because the clock says it is time to post. It
# posts because it has something useful, factual, timely or genuinely
# interesting to tell someone. The schedule creates ONE opportunity a day; the
# content earns publication. A run that produces nothing is the system working.
#
# THE SHAPE OF A DAY (since 2026-10-08; three windows a day before that)
# ---------------------------------------------------------------------
#   daily      09:00–13:59 America/Chicago. At most one post: the best eligible
#              development, else (quiet day) a verified explainer or data
#              insight within its weekly ceiling, else nothing.
#   breaking   14:00–20:59. At most one more post, and only for a MAJOR
#              development published today or yesterday. Never routine content.
# See src/lib/social/slots.ts and src/lib/social/cadence.ts.
#
# WHAT A SCHEDULED RUN ACTUALLY DOES
# ----------------------------------
#   gate (window open and unfilled? X balance not already refused today? in the
#   breaking window, any major unposted development?) → cadence → candidates →
#   queue → rotation → subject/URL cooldown → LLM (or stored ready copy) →
#   validate → opening + shape variety → wording dedupe → publish → commit
#   ledger + queue
#
# Every stage can end the run, and every refusal is a named row in the ledger.
# Nothing here can publish a figure that is not in the fact set, a link that is
# not whitelisted, a quotation that is not verbatim, or a post too similar to a
# recent one.
#
# WHY SEVERAL FIRINGS FOR ONE POST, AND WHY THAT IS SAFE
# ------------------------------------------------------
# GitHub delivers scheduled runs late under load — hours late, measured on this
# workflow in 2026-08 — and sometimes not at all. So the cron fires every hour
# the daily window can be open, and a late firing still lands inside it. The
# ledger's rerun guard (one post per window per day) and the cadence ceiling
# (one daily post) stop two firings from posting twice, and the gate answers
# both BEFORE dependencies are installed, so a no-op firing costs seconds and
# makes no API call.
#
# GitHub Actions cron is ALWAYS UTC and has no timezone key. The hours below are
# scheduledUtcHours() in src/lib/social/slots.ts, which the tests pin against
# this file, and the Chicago hour is read from the real tz database at run time,
# so daylight saving needs no edit here:
#
#     firing (UTC)   CDT (UTC-5, Mar–Nov)        CST (UTC-6, Nov–Mar)
#     14:03          09:03  daily — first        08:03  outside; gate stops
#     15:03          10:03  daily                09:03  daily — first
#     16:03–18:03    11:03–13:03 daily (late)    10:03–12:03 daily (late)
#     19:03          14:03  breaking             13:03  daily (late)
#     21:03          16:03  breaking             15:03  breaking
#     23:03          18:03  breaking             17:03  breaking
#     01:03          20:03  breaking             19:03  breaking
#
# WHY THIS DOES NOT TOUCH THE NEWSLETTER
# --------------------------------------
# Deliberately separate: separate workflow, separate ledger, separate secrets,
# separate enable flag. A fault in social publishing must not be able to affect
# a system that sends email.

name: Social publishing

on:
  # ┌──────────────────────────────────────────────────────────────────────────┐
  # │ THE AUTOMATIC SCHEDULE IS ARMED. This account publishes unattended.      │
  # │                                                                          │
  # │ Scheduled firings pass --live, and SOCIAL_POST_ENABLED is "true", so a   │
  # │ run that clears every gate posts to X for real with nobody watching.     │
  # │                                                                          │
  # │ TO STOP EVERYTHING, fastest first:                                       │
  # │   1. Set the repository variable SOCIAL_POST_ENABLED to anything other   │
  # │      than "true". Runs continue, select, generate and validate; they     │
  # │      publish nothing. No code change, effective immediately.             │
  # │   2. Comment out the `- cron:` lines below. Stops the runs too.          │
  # │                                                                          │
  # │ LinkedIn is NOT enabled. Its secrets are wired but unset, so it records  │
  # │ SKIPPED_CREDENTIAL_EXPIRED and can no longer make a subject "eligible":  │
  # │ selection only considers platforms that can actually publish.           │
  # └──────────────────────────────────────────────────────────────────────────┘
  # WHY :03 AND NOT :00 — GitHub documents the top of the hour as its most
  # contended minute, when queued scheduled runs may be dropped. Safe because
  # the gate matches on the window, not the minute.
  schedule:
    # The daily window, every hour it can be open in CDT or CST.
    - cron: "3 14-19 * * *"
    # Breaking checks — three a day, inside the breaking window in both offsets.
    - cron: "3 21,23,1 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Force a window. Blank uses the current Chicago hour."
        type: choice
        options: ["", "daily", "breaking"]
        required: false
        default: ""
      live:
        description: "PUBLISH to the live account. Requires SOCIAL_POST_ENABLED=true as well."
        type: boolean
        default: false
      dry_run_day:
        description: "Preview a whole week (daily + breaking windows) with the real model. Publishes NOTHING, ignores `live`."
        type: boolean
        default: false

permissions:
  contents: write # commit the post ledger and the editorial queue

concurrency:
  # Shares the writer lock with the newsletter and the data refreshes: all of
  # them commit generated files to main, so they must not interleave.
  group: main-writer
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # THE COPY ENGINE. OpenAI is the production provider. Absent a key, a live
      # run skips rather than publishing something a model did not write —
      # there is no template fallback and never has been.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Kept wired, not deleted. SOCIAL_ENGINE=anthropic restores the previous
      # provider in one variable.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # THE PROVIDER NAME, WITH AN EXPLICIT DEFAULT. An unset repository variable
      # renders as the EMPTY STRING, which once reached createCopyEngine() as
      # "" and killed every scheduled run. `|| 'openai'` makes the fallback
      # visible here, at JOB level so every step inherits it.
      SOCIAL_ENGINE: ${{ vars.SOCIAL_ENGINE || 'openai' }}
      SOCIAL_MODEL: ${{ vars.SOCIAL_MODEL }}

      # X — OAuth 1.0a user context. These tokens do not expire, which is what
      # lets X genuinely run unattended. The API is pay-per-use: a run that
      # meets HTTP 402 records SKIPPED_PUBLISH_FAILED with "credits depleted"
      # and leaves the validated copy in the queue for the next window.
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}

      # LinkedIn — the access token EXPIRES on a fixed cycle and programmatic
      # refresh is gated behind an approved-partner product. Wiring these is
      # safe whether or not the secrets exist: readLinkedInCredentials()
      # requires BOTH values, so an unset secret resolves to the empty string,
      # no LinkedIn publisher is constructed, and X is entirely unaffected.
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_AUTHOR_URN: ${{ vars.LINKEDIN_AUTHOR_URN }}

      # THE PUBLISHING SWITCH. scripts/social-post.ts requires this to equal
      # exactly "true". The `--live` flag below is a second, independent gate.
      SOCIAL_POST_ENABLED: ${{ vars.SOCIAL_POST_ENABLED }}

      # Absolute URLs in post copy. Without it the deep links fall back to the
      # production domain baked into src/lib/site.ts, which is correct anyway.
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the ledger push rebases onto origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # THE GATE, BEFORE THE INSTALL.
      #
      # Most firings are no-ops: the hour is outside every window, or the open
      # window already published today. scripts/social-gate.ts answers both from
      # files already in the checkout, using tsx alone, so a no-op firing never
      # pays for `npm ci`. Manual dispatches skip this: a human forcing a window
      # has already decided.
      - name: Is a window open, and unfilled?
        id: gate
        if: github.event_name == 'schedule'
        run: |
          if npx --yes tsx scripts/social-gate.ts; then
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.open == 'true'
        run: npm ci

      # Reports ledger and queue health, which credentials are present, what the
      # cadence policy would allow right now, and what the queue holds. It exits
      # non-zero only for conditions that make a run unsafe.
      - name: Preflight
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.open == 'true'
        run: npm run social:preflight

      # Proves the X credential authenticates, using a read-only GET that cannot
      # publish. Non-blocking: a transient X outage here must not suppress a
      # post that would otherwise succeed.
      #
      # Manual dispatches only. X's API is prepaid per request, and a scheduled
      # run learns the same thing from the publish call itself (401 and 402 are
      # both recorded by name), so checking first on every scheduled run spent
      # a request a day for nothing.
      - name: Verify the X credential (read-only)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run_day != 'true'
        continue-on-error: true
        run: npm run social:verify-x

      # A WHOLE WEEK, PREVIEWED, WITH THE REAL MODEL AND NO PUBLISHER.
      # scripts/social-simulate.ts calls runSlot() with `publishers: {}` and
      # `live: false` — there is no platform client to publish through, whatever
      # SOCIAL_POST_ENABLED says.
      - name: Preview a week (dry run, real model)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run_day == 'true'
        run: |
          npm run social:simulate -- --days=7 --engine=openai --ledger=src/lib/generated/social-posted.json | tee /tmp/social-run.log

      # THE RUN.
      #
      # `--live` is passed on every scheduled firing and on a dispatch only when
      # the operator ticked the box. social-post.ts then requires
      # SOCIAL_POST_ENABLED to be "true" as well.
      - name: Publish this window
        if: |
          github.event.inputs.dry_run_day != 'true'
          && (github.event_name == 'workflow_dispatch' || steps.gate.outputs.open == 'true')
        run: |
          # WITHOUT THIS, A FAILED PUBLISH IS A GREEN CHECKMARK. A bash pipeline
          # reports its LAST command's status, and the last command is `tee`.
          set -o pipefail
          ARGS=""
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            ARGS="$ARGS --slot=${{ github.event.inputs.slot }}"
          fi
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.live }}" = "true" ]; then
            ARGS="$ARGS --live"
          fi
          npm run social:post -- $ARGS | tee /tmp/social-run.log

      - name: Summarise
        if: always() && (github.event_name == 'workflow_dispatch' || steps.gate.outputs.open == 'true')
        run: |
          {
            echo "## Social publishing"
            echo ""
            echo '```'
            cat /tmp/social-run.log 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # THE LEDGER AND THE QUEUE MUST SURVIVE THE RUN.
      #
      # The ledger is what stops a subject being posted twice; the queue is what
      # keeps validated copy for the next window when a publish fails. Both run
      # even on failure: a post that went out and then hit a failing step MUST
      # still record its row, or the next run repeats it.
      - name: Persist the post ledger and the editorial queue
        if: |
          always()
          && github.event.inputs.dry_run_day != 'true'
          && (github.event_name == 'workflow_dispatch' || steps.gate.outputs.open == 'true')
        run: |
          bash .github/scripts/commit-and-push.sh \
            "chore(social): record window $(date -u +%Y-%m-%dT%H:%M)" \
            src/lib/generated/social-posted.json \
            src/lib/generated/social-queue.json

      - name: Publishing not enabled
        if: |
          vars.SOCIAL_POST_ENABLED != 'true'
          && (github.event_name == 'schedule' || github.event.inputs.live == 'true')
          && (github.event_name == 'workflow_dispatch' || steps.gate.outputs.open == 'true')
        run: |
          {
            echo "### Nothing was published"
            echo ""
            echo 'The window ran, selected, generated and validated normally, but the'
            echo 'repository variable `SOCIAL_POST_ENABLED` is not set to `true`, so'
            echo 'nothing reached X.'
            echo ""
            echo "See docs/social.md for the go-live checklist."
          } >> "$GITHUB_STEP_SUMMARY"
