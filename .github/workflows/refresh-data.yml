# Automatic data refresh + historical archive + Netlify rebuild.
#
# Every 6 hours this:
#   1. installs deps and runs the real prebuild (scripts/refresh-data.mjs +
#      scripts/build-dataset.ts) — the SAME pipeline Netlify runs — which
#      fetches the near-live feeds (BLS, CBP) and appends the latest CBP month
#      to the growing historical archive (src/lib/generated/history.json),
#   2. commits the archive + snapshot back to the repo ONLY when the underlying
#      data actually changed (so the archive persists and grows over time, but
#      we don't churn a commit every 6h on identical data),
#   3. pings the Netlify build hook so the live site rebuilds (its own prebuild
#      re-fetches, so the deploy always reflects current data).
#
# Failures are logged to the job summary; the previous good build stays live.
#
# REQUIREMENTS:
#   - Secret NETLIFY_BUILD_HOOK (you created this).
#   - The Netlify site is linked to this repo so the hook has a source to build.
#   - If your Netlify site ALSO auto-deploys on git push, the (occasional)
#     archive commit will trigger an extra deploy; drop the hook step below if so.
#
# Note: the BLS public API allows ~25 unauthenticated requests/IP/day. At 4
# runs/day plus Netlify's build-time fetch this stays well under the limit.

name: Refresh data, archive & rebuild

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: {}

permissions:
  contents: write # needed to commit the growing historical archive

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Refresh feeds + build dataset (same pipeline as the deploy)
        run: npm run prebuild

      - name: Read refresh status
        id: status
        run: |
          OK=$(node -e "try{process.stdout.write(require('./src/lib/generated/refresh.json').ok?'true':'false')}catch(e){process.stdout.write('false')}")
          echo "ok=$OK" >> "$GITHUB_OUTPUT"
          node -e "const r=require('./src/lib/generated/refresh.json');const L=['## Data refresh','','- status: '+(r.ok?'✅ ok':'⚠️ errors'),'- ran at: '+r.generatedAt,'- BLS: '+(r.bls&&r.bls.ok?('ok — '+r.bls.period):'STALE'),'- CBP: '+(r.cbp&&r.cbp.ok?('ok — FY'+r.cbp.currentFy+' YTD '+r.cbp.currentFyYtd+' (through '+r.cbp.reportingMonthLabel+')'):(r.cbp&&r.cbp.stale?'stale (last good)':'unavailable')),''];if(r.errors&&r.errors.length){L.push('### Errors');for(const e of r.errors)L.push('- '+e);}require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY,L.join('\n')+'\n');"

      - name: Detect historical-archive change (ignoring timestamps)
        id: archive
        run: |
          git show HEAD:src/lib/generated/history.json > /tmp/old-history.json 2>/dev/null || echo '{}' > /tmp/old-history.json
          CHANGED=$(node -e "const o=(require('/tmp/old-history.json').cbpNationwideYtd)||[];const n=(require('./src/lib/generated/history.json').cbpNationwideYtd)||[];process.stdout.write(JSON.stringify(o)===JSON.stringify(n)?'false':'true')")
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "Archive changed: $CHANGED" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit archive + snapshot (only when data changed)
        if: steps.archive.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/lib/generated/history.json src/lib/generated/refresh.json src/lib/generated/dataset.json public/data-manifest.json
          git commit -m "chore(data): archive CBP release + refresh snapshot [skip ci]"
          git push

      - name: Log failures (no rebuild triggered)
        if: steps.status.outputs.ok != 'true'
        run: echo "::warning::Data refresh reported failures — keeping the last good build live. See job summary."

      - name: Trigger Netlify rebuild (only after a successful refresh)
        if: steps.status.outputs.ok == 'true'
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::NETLIFY_BUILD_HOOK secret is not set."
            exit 1
          fi
          curl -fsS -X POST -d '{"trigger_title":"scheduled-refresh"}' "$HOOK"
          echo "✅ Triggered Netlify rebuild (it re-fetches near-live data during the build)."
