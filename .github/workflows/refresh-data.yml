# Automatic data refresh + historical archive + Vercel deploy.
#
# Once a day this:
#   1. installs deps and runs the real prebuild (scripts/refresh-data.mjs +
#      scripts/build-dataset.ts) — the SAME pipeline Vercel runs — which fetches
#      the near-live feeds (BLS, CBP, Texas WARN) and appends the latest CBP
#      month to the historical archive (src/lib/generated/history.json),
#   2. detects whether the underlying DATA actually changed (ignoring timestamps),
#   3. only if it changed, commits the refreshed snapshot + archive back to the
#      repo. The push to `main` triggers Vercel's git integration to rebuild
#      (Vercel's own prebuild re-fetches, so the deploy reflects current data).
#
# Free-tier note: the underlying data moves at most weekly (WARN) / monthly
# (CBP, BLS), so gating the commit on a real data change keeps Vercel builds to a
# handful per month — well within Vercel Free (Hobby) limits. A daily cron is
# plenty for these cadences. Failures keep the last good build live.
#
# DEPLOY: this repo is connected to Vercel via the Git integration, so any push
# to `main` auto-deploys. No deploy hook is required. If you instead use a Vercel
# Deploy Hook, add it as the secret VERCEL_DEPLOY_HOOK and it will also be pinged.
#
# The push goes straight to `main` — no bot branch, no pull request, no review
# step. `main` stays protected for humans; the GitHub Actions bot is on the
# ruleset's bypass list so GITHUB_TOKEN can land this commit. See
# docs/deployment.md → "Automated pushes to a protected main".

name: Refresh data, archive & deploy

on:
  schedule:
    - cron: "0 11 * * *" # once daily (11:00 UTC) — see free-tier note above
  workflow_dispatch: {}

permissions:
  contents: write # the only scope needed: commit + push generated data

# Shared with every other workflow that writes generated files to `main`, so two
# refreshes can never interleave their commits. `cancel-in-progress: false`
# because a half-finished data refresh must not be killed — the queued run waits
# its turn instead. GitHub keeps at most one run pending per group; a third
# arrival is dropped, which is harmless here since the next cron re-runs it.
concurrency:
  group: main-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: `git pull --rebase` before the push needs real history,
          # and the default shallow clone makes rebases fail unpredictably.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Refresh feeds + build dataset (same pipeline as the deploy)
        run: |
          echo "::group::Generation — refresh feeds, rebuild dataset, archive, events, pulse email"
          npm run prebuild
          echo "::endgroup::"
        env:
          # Congress ingests nothing without this; absent, the adapter correctly
          # reports itself unconfigured rather than failing. See docs/deployment.md.
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          # The default per-adapter cap is 250. A 90-day incremental window sits
          # well under it, but the cap is a silent-data-loss risk if a busy
          # quarter ever exceeds it — and this job is unattended. Raising it here
          # costs nothing and removes the failure mode; capEvents still reports
          # if it ever engages.
          EVENTS_LIMIT: "1000"

      - name: Read refresh status
        id: status
        run: |
          node -e "const r=require('./src/lib/generated/refresh.json');const L=['## Data refresh','','- status: '+(r.ok?'✅ ok':'⚠️ errors'),'- ran at: '+r.generatedAt,'- BLS: '+(r.bls&&r.bls.ok?('ok — '+r.bls.period):'STALE'),'- CBP: '+(r.cbp&&r.cbp.ok?('ok — FY'+r.cbp.currentFy+' YTD '+r.cbp.currentFyYtd+' (through '+r.cbp.reportingMonthLabel+')'):(r.cbp&&r.cbp.stale?'stale (last good)':'unavailable')),'- WARN (TX): '+(r.warn&&r.warn.ok?('ok — '+r.warn.ytdYear+' YTD '+r.warn.ytdTotal):(r.warn&&r.warn.stale?'stale (last good)':'unavailable')),''];if(r.errors&&r.errors.length){L.push('### Errors');for(const e of r.errors)L.push('- '+e);}require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY,L.join('\n')+'\n');"

      - name: Detect real data change (ignoring timestamps)
        id: changed
        run: |
          git show HEAD:src/lib/generated/refresh.json > /tmp/old-refresh.json 2>/dev/null || echo '{}' > /tmp/old-refresh.json
          git show HEAD:src/lib/generated/history.json > /tmp/old-history.json 2>/dev/null || echo '{}' > /tmp/old-history.json
          git show HEAD:src/lib/generated/employers.json > /tmp/old-employers.json 2>/dev/null || echo '{}' > /tmp/old-employers.json
          git show HEAD:src/lib/generated/events.json > /tmp/old-events.json 2>/dev/null || echo '{}' > /tmp/old-events.json
          CHANGED=$(node -e "
          const f=require('fs');
          const j=p=>{try{return JSON.parse(f.readFileSync(p,'utf8'))}catch{return {}}};
          // Events are part of the signature. They were not, and the omission
          // meant a new Executive Order — the single most consequential thing
          // this site reports — produced no commit and therefore no deploy,
          // because BLS/CBP/WARN had not moved that day. The flagship feature
          // was not on the automation at all.
          //
          // Identity is the set of event IDS, not the file: events.json carries
          // a generatedAt and a per-run adapter report that change on every run,
          // so hashing the file would deploy daily and defeat the free-tier gate.
          const eventSig=e=>{
            const ids=(e.events||[]).map(x=>x.id).sort();
            return [ids.length, require('crypto').createHash('sha1').update(ids.join('\n')).digest('hex')];
          };
          const sig=(r,h,e,ev)=>JSON.stringify({
            bls:[r.bls&&r.bls.value, r.bls&&r.bls.period],
            cbp:[r.cbp&&r.cbp.currentFyYtd, r.cbp&&r.cbp.fyTotals],
            warn:[r.warn&&r.warn.ytdTotal, r.warn&&r.warn.ytdCount, r.warn&&r.warn.monthly],
            hist:((h.cbpNationwideYtd)||[]).map(x=>[x.period,x.cbpNationwideYtd]),
            emp:[e.fiscalYear, e.count],
            events:eventSig(ev),
          });
          const a=sig(j('/tmp/old-refresh.json'), j('/tmp/old-history.json'), j('/tmp/old-employers.json'), j('/tmp/old-events.json'));
          const b=sig(j('./src/lib/generated/refresh.json'), j('./src/lib/generated/history.json'), j('./src/lib/generated/employers.json'), j('./src/lib/generated/events.json'));
          process.stdout.write(a===b?'false':'true');
          ")
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "Data changed: $CHANGED" >> "$GITHUB_STEP_SUMMARY"

      # Staging, commit, rebase, push and retry all live in the shared script so
      # this workflow and refresh-warn.yml cannot maintain divergent file lists
      # again. It stages the whole generated surface, so newly added outputs are
      # picked up without anyone remembering to edit a `git add` line.
      - name: Commit refreshed data & push to main (triggers Vercel deploy)
        if: steps.changed.outputs.changed == 'true'
        run: |
          bash .github/scripts/commit-and-push.sh "chore(data): refresh snapshot + archive"

      - name: Optional Vercel deploy hook
        if: steps.changed.outputs.changed == 'true'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsS -X POST "$HOOK" && echo "✅ Pinged Vercel deploy hook."
          else
            echo "No VERCEL_DEPLOY_HOOK set — relying on Vercel git integration to auto-deploy the pushed commit."
          fi

      - name: No change — skip deploy
        if: steps.changed.outputs.changed != 'true'
        run: echo "Underlying data unchanged — nothing committed, no Vercel build triggered (free-tier friendly)."
