# Automatic data refresh + Netlify rebuild.
#
# Every 6 hours this runs the near-live fetch (a health check), and ONLY if the
# refresh succeeded does it ping the Netlify build hook. Netlify then rebuilds
# from the connected repo — its own `prebuild` step re-fetches the feeds so the
# fresh data is baked into the new deploy. Failures are logged to the job
# summary and the previous good build stays live (nothing is triggered).
#
# REQUIREMENTS:
#   - Secret NETLIFY_BUILD_HOOK  (✅ you created this)
#   - The Netlify site must be linked to this GitHub repo, otherwise the build
#     hook has no source to build from. (Netlify → Site configuration →
#     Build & deploy → Link repository.)
#
# Note: the BLS public API allows ~25 unauthenticated requests/IP/day. At 4
# runs/day here plus Netlify's build-time fetch this stays well under the limit;
# register a free BLS key only if you add many more series.

name: Refresh data & rebuild

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh near-live feeds (health check)
        run: node scripts/refresh-data.mjs

      - name: Read refresh status
        id: status
        run: |
          OK=$(node -e "try{process.stdout.write(require('./src/lib/generated/refresh.json').ok?'true':'false')}catch(e){process.stdout.write('false')}")
          echo "ok=$OK" >> "$GITHUB_OUTPUT"
          node -e "const r=require('./src/lib/generated/refresh.json');const L=['## Data refresh','','- status: '+(r.ok?'✅ ok':'⚠️ errors'),'- ran at: '+r.generatedAt,'- BLS: '+(r.bls&&r.bls.ok?('ok — '+r.bls.period):'STALE'),''];if(r.errors&&r.errors.length){L.push('### Errors');for(const e of r.errors)L.push('- '+e);}require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY,L.join('\n')+'\n');"

      - name: Log failures (no rebuild triggered)
        if: steps.status.outputs.ok != 'true'
        run: echo "::warning::Data refresh reported failures — keeping the last good build live. See job summary."

      - name: Trigger Netlify rebuild (only after a successful refresh)
        if: steps.status.outputs.ok == 'true'
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::NETLIFY_BUILD_HOOK secret is not set."
            exit 1
          fi
          curl -fsS -X POST -d '{"trigger_title":"scheduled-refresh"}' "$HOOK"
          echo "✅ Triggered Netlify rebuild (it re-fetches near-live data during the build)."
