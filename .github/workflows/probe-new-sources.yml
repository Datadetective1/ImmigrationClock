name: Probe new sources (temporary)
on:
  push:
    branches: [feat/new-official-sources]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Refresh data (EOIR caseload included)
        run: node scripts/refresh-data.mjs
      - name: Show EOIR caseload reading
        run: node -e "const r=require('./src/lib/generated/refresh.json');const e=r.eoir;console.log(JSON.stringify({ok:e.ok,fy:e.fy,pending:e.pending,receipts:e.receipts,completions:e.completions,dataGenerated:e.dataGenerated,postedAt:e.postedAt,note:e.note},null,1))"
      - name: Run the three new adapters
        run: |
          cat > /tmp/probe.ts <<'TS'
          import { whiteHouseActionsAdapter } from "./src/domains/graph/adapters/white-house-actions";
          import { eoirPrecedentsAdapter } from "./src/domains/graph/adapters/eoir-precedents";
          import { eoirCaseloadAdapter } from "./src/domains/graph/adapters/eoir-caseload";
          import { validateEvent } from "./src/domains/graph/events";
          async function main() {
          const since = new Date(Date.now() - 90 * 864e5).toISOString().slice(0, 10);
          for (const a of [whiteHouseActionsAdapter, eoirPrecedentsAdapter, eoirCaseloadAdapter]) {
            const r = await a.fetchEvents!({ since, limit: 250 });
            const invalid = r.events.flatMap(validateEvent);
            console.log(`\n== ${a.key}: failed=${r.failed} events=${r.events.length} invalid=${invalid.length}`);
            for (const w of r.warnings) console.log(`  warning: ${w}`);
            for (const e of r.events.slice(0, 6)) console.log(`  ${e.publishedAt} ${e.severity} ${e.title}\n    ${e.sourceUrl}`);
            for (const i of invalid.slice(0, 5)) console.log(`  INVALID ${i}`);
          }
          }
          main().catch((e) => { console.error(e); process.exit(1); });
          TS
          cp /tmp/probe.ts ./probe.ts && npx tsx probe.ts
