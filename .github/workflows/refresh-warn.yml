# Wide-net WARN refresh: scrape state WARN portals via biglocalnews/warn-scraper,
# normalize into the committed cache, rebuild the site's WARN feed + public API,
# and (only if the data actually changed) commit back to `main` → Vercel deploys.
#
# Shape — three jobs:
#
#   plan ──► scrape (matrix: one runner per batch of states) ──► publish
#
# · plan turns the `states` input into batches (scripts/warn-scrape-plan.mjs),
#   dropping any code the scraper package has no parser for. Such a code used to
#   crash the scrape mid-list, taking every later state with it.
# · scrape runs each state IN ITS OWN PROCESS with its own timeout
#   (.github/scripts/scrape-warn-states.sh) and uploads the CSVs plus a status
#   record per state. Batches run in parallel and independently (fail-fast:
#   false); a batch fails only when no state in it produced data.
# · publish merges every batch, normalizes into src/lib/generated/warn-scraper.json
#   — keeping the last good snapshot of any state that failed this run — rebuilds
#   the feed, and commits if the data changed.
#
# Only publish holds the `main-writer` lock. Scraping forty portals can take the
# better part of an hour, and the lock is shared with the daily data refresh,
# the newsletter and the social poster: GitHub keeps at most one run waiting per
# group and drops the next arrival, so a long scrape inside the lock could cost
# a newsletter. Publish itself takes about two minutes.
#
# Why this is separate from refresh-data.yml: warn-scraper needs Python plus
# system packages (Xvfb for the Selenium-based state scrapers) that the site
# build must NOT depend on. The Vercel build stays Python-free — it just reads
# the committed JSON.
#
# Before 2026-09-11 this was one job asking for eleven states in one process.
# Georgia's portal hung on a TCP connect, the process died, six states were
# never attempted, two of the eleven had no parser at all, and `|| true` made
# the run green. The site showed five states.

name: Refresh WARN feed (wide net)

on:
  schedule:
    # Tue & Fri 09:00 UTC. WARN portals update ~weekly; CA's report posts Tue/Thu.
    - cron: "0 9 * * 2,5"
  workflow_dispatch:
    inputs:
      states:
        description: "Postal codes to scrape (space-separated); 'default' = every supported state without a live adapter; 'all' = every supported state"
        required: false
        default: "default"
      commit:
        description: "Commit the refreshed data to main. Untick for a dry run that only reports per-state outcomes."
        type: boolean
        required: false
        default: true
      accept_partial:
        description: "Postal codes (or 'all') whose smaller-than-last-time read should replace the kept snapshot — only when a portal really pruned its archive"
        required: false
        default: ""

permissions:
  contents: write # the only scope needed: commit + push generated data

env:
  WARN_STATES: ${{ github.event.inputs.states || 'default' }}
  # Seconds one state may run before it is killed. Georgia once hung on a TCP
  # connect for the rest of the job; now it can only cost itself.
  WARN_STATE_TIMEOUT: "420"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      batches: ${{ steps.plan.outputs.batches }}
      states: ${{ steps.plan.outputs.states }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Resolve the state list and split it into batches
        id: plan
        run: node scripts/warn-scrape-plan.mjs --batches 5 "$WARN_STATES"

  scrape:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      # One batch's failure must never cancel the others.
      fail-fast: false
      max-parallel: 5
      matrix:
        batch: ${{ fromJSON(needs.plan.outputs.batches) }}
    name: scrape ${{ matrix.batch.name }}
    env:
      # Passed through the environment, never interpolated into the shell line.
      BATCH_STATES: ${{ matrix.batch.states }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install warn-scraper + Xvfb (for Selenium-based state scrapers)
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          python -m pip install --upgrade pip
          # pyquery and lxml are imported by the Kentucky, Michigan and Ohio
          # parsers but are not declared as dependencies of warn-scraper; without
          # them those three states fail on import (2026-09-11 dry run).
          pip install warn-scraper pyquery lxml

      - name: Scrape each state in its own process (one failure cannot stop the rest)
        run: |
          mkdir -p /tmp/warn
          # shellcheck disable=SC2086 — the list is meant to word-split
          bash .github/scripts/scrape-warn-states.sh /tmp/warn $BATCH_STATES

      - name: Upload CSVs, per-state status records and logs
        # always(): a batch that timed out still hands over what it scraped.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warn-scrape-${{ strategy.job-index }}
          path: |
            /tmp/warn/*.csv
            /tmp/warn/status/
            /tmp/warn/logs/
          if-no-files-found: warn
          retention-days: 7

  publish:
    needs: [plan, scrape]
    # Runs even when a batch failed or timed out: whatever was scraped is
    # published and every other state keeps its last good snapshot.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Shared with refresh-data.yml, newsletter.yml and social.yml — see the note
    # in refresh-data.yml. Only this job writes to `main`, so only it takes the
    # lock; the scrape above runs outside it.
    concurrency:
      group: main-writer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history — `git pull --rebase` before the push needs it.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install node dependencies
        run: npm ci

      - name: Collect every batch's output
        uses: actions/download-artifact@v4
        with:
          pattern: warn-scrape-*
          path: /tmp/warn
          merge-multiple: true

      - name: Normalize CSVs → committed cache (src/lib/generated/warn-scraper.json)
        env:
          WARN_ACCEPT_PARTIAL: ${{ github.event.inputs.accept_partial }}
        run: |
          echo "::group::Generation — normalize scraped CSVs into the committed cache"
          ls -la /tmp/warn /tmp/warn/status 2>/dev/null || true
          WARN_SCRAPE_DIR=/tmp/warn npm run refresh:warn-scraper
          echo "::endgroup::"

      - name: Rebuild WARN feed + public API from the fresh cache
        run: |
          echo "::group::Generation — rebuild WARN feed, summary and public API"
          npm run build:warn
          echo "::endgroup::"

      - name: Detect real data change (ignoring generatedAt timestamps)
        id: changed
        run: |
          git show HEAD:src/lib/generated/warn.json > /tmp/old-warn.json 2>/dev/null || echo '{}' > /tmp/old-warn.json
          CHANGED=$(node -e "
          const crypto=require('crypto');
          const f=require('fs');
          const load=p=>{try{return JSON.parse(f.readFileSync(p,'utf8'))}catch{return {}}};
          // Signature ignores generatedAt; canonicalizes notice order so ties don't churn.
          const sig=w=>{
            const keys=(w.notices||[]).map(n=>[n.state,n.normalized,n.noticeDate,n.effectiveDate,n.employees].join('|')).sort();
            const h=crypto.createHash('sha1').update(keys.join('\n')).digest('hex');
            return JSON.stringify({n:w.noticeCount,e:w.employeesTotal,emp:w.employerCount,st:(w.states||[]).map(s=>[s.code,s.noticeCount,s.employeesTotal]),h});
          };
          const a=sig(load('/tmp/old-warn.json'));
          const b=sig(load('./src/lib/generated/warn.json'));
          process.stdout.write(a===b?'false':'true');
          ")
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "WARN data changed: $CHANGED" >> "$GITHUB_STEP_SUMMARY"

      # Same shared script as refresh-data.yml; it carries warn-summary.json and
      # the scraper cache alongside warn.json and the public API files.
      - name: Commit refreshed WARN data & push to main (triggers deploy)
        # On a schedule there are no inputs, so `commit` is empty and this runs.
        if: steps.changed.outputs.changed == 'true' && github.event.inputs.commit != 'false'
        run: |
          bash .github/scripts/commit-and-push.sh "chore(warn): refresh wide-net WARN feed"

      - name: Optional Vercel deploy hook
        if: steps.changed.outputs.changed == 'true' && github.event.inputs.commit != 'false'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsS -X POST "$HOOK" && echo "✅ Pinged Vercel deploy hook."
          else
            echo "No VERCEL_DEPLOY_HOOK set — relying on Vercel git integration to auto-deploy."
          fi

      - name: Dry run — nothing committed
        if: github.event.inputs.commit == 'false'
        run: |
          echo "Dry run: the refreshed cache was built and validated but not committed (changed=${{ steps.changed.outputs.changed }})."
          echo "- **dry run:** nothing committed" >> "$GITHUB_STEP_SUMMARY"

      - name: No change — skip
        if: steps.changed.outputs.changed != 'true' && github.event.inputs.commit != 'false'
        run: echo "WARN data unchanged — nothing committed."
